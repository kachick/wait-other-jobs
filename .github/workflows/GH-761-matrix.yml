name: GH-761 - Matrix
on:
  push:
    branches: [main]
    paths:
      - '**GH-761**'
      - 'action.yml'
      - 'dist/**'
  pull_request:
    paths:
      - '**GH-761**'
      - 'action.yml'
      - 'dist/**'
  schedule:
    # Every 11:30 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '30 2 * * *'
  workflow_dispatch:

# Disable all permissions in workflow global as to setup clean room
# However PRs will have read permissions because this project is on a public repository
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  echo:
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 5
    steps:
      - run: |
          sleep 10
          echo ':)'
  wait:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-26.04", "ubuntu-26.04-arm", "ubuntu-slim", "macos-26", "windows-2025-vs2026"]') || fromJSON('["ubuntu-slim"]') }}
        warmup-delay: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["PT3S", "PT7S"]') || fromJSON('["PT3S"]') }}
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    # name: # By default, GitHub sets with `github.job` and the matrix values
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: wait
        with:
          retry-method: 'equal_intervals'
          warmup-delay: '${{ matrix.warmup-delay }}'
          minimum-interval: 'PT5S'
          skip-same-workflow: 'false' # Intentionally set false to test skip list also can cover this use case
          # Should specify jobName to test details
          # But we should pattern likes regex for the jobName
          skip-list: |
            [
              {
                "workflowFile": "e2e-observer.yml"
              },
              {
                "workflowFile": "e2e-subject.yml"
              },
              {
                "workflowFile": "GH-761-matrix.yml",
                "jobName": "${{ github.job }}",
                "jobMatchMode": "prefix"
              },
              {
                "workflowFile": "e2e-deadlock-hazard.yml"
              }
            ]
      - name: Upload dumps as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'outputs-${{ github.job }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.runner }}-${{ matrix.warmup-delay }}'
          path: '${{ steps.wait.outputs.dump }}'
