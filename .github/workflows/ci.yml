name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '.editorconfig'
      - '**.md'
      - '.vscode/**'
  pull_request:
    paths-ignore:
      - '.editorconfig'
      - '**.md'
      - '.vscode/**'
  schedule:
    # Every 10:42 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all:
    name: All
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - name: Install direnv
        run: nix profile add --inputs-from . nixpkgs#direnv
      - name: Load environment variables
        run: |
          direnv allow .
          direnv export gha > "$GITHUB_ENV"

      # See https://github.com/actions/setup-node/blob/802632921f8532d2409ae6eac3313b6f81f11122/src/cache-utils.ts#L30-L38
      - name: Get pnpm store path
        id: get-pnpm-path
        run: |
          echo "pnpm-store-path=$(nix develop --command pnpm store path --silent)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache pnpm store
        with:
          path: |
            ${{ steps.get-pnpm-path.outputs.pnpm-store-path }}
          key: |
            pnpm_store-pnpm_${{ hashFiles('pnpm-lock.*') }}-flake_${{ hashFiles('flake.lock') }}-${{ runner.arch }}-${{ runner.os }}
      - name: Setup
        run: |
          pnpm run setup
      - name: Test, build, lint
        run: |
          pnpm run all
      - name: Make sure there is no diff after build
        run: |
          pnpm run check_no_git_diff
