name: Test Deadlock Hazard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-deadlock-hazard.yml'
      - '.github/workflows/itself.yml'
      - 'action.yml'
      - 'dist/**'
  pull_request:
    paths:
      - '.github/workflows/test-deadlock-hazard.yml'
      - '.github/workflows/itself.yml'
      - 'action.yml'
      - 'dist/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hazard_waiter:
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for itself.yml's skip-list job
        uses: ./
        with:
          retry-method: 'equal_intervals'
          minimum-interval: 'PT5S'
          attempt-limits: 60
          wait-list: |
            [
              {
                "workflowFile": "itself.yml",
                "jobName": "skip-list"
              }
            ]
