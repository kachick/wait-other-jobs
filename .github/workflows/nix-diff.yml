name: ❄️ Diff
on:
  pull_request:
    paths:
      - 'flake.lock'
      - '.github/workflows/nix-diff.yml'

permissions:
  contents: read

jobs:
  diff:
    name: Diff closures
    permissions:
      contents: read
      pull-requests: write # Post closure differences to PR comments
    uses: kachick/workflows/.github/workflows/reusable-nix-diff-closures.yml@main # zizmor: ignore[unpinned-uses]
    with:
      runs-on: ubuntu-26.04
      targets: devShells.x86_64-linux.default
