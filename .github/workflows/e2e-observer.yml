name: 👀 (E2E Observer)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-deadlock-hazard.yml'
      - '.github/workflows/e2e-observer.yml'
      - 'action.yml'
      - 'dist/**'
  pull_request:
    paths:
      - '.github/workflows/e2e-deadlock-hazard.yml'
      - '.github/workflows/e2e-observer.yml'
      - 'action.yml'
      - 'dist/**'
  schedule:
    # Every 10:50 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '50 1 * * *'
  workflow_dispatch:

# Disable all permissions in workflow global as to setup clean room
# However PRs will have read permissions because this project is on a public repository
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Do not enable `ACTIONS_STEP_DEBUG: true` for all steps, I also want to check actual logging

jobs:
  echo:
    name: echo
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 5
    steps:
      - run: echo 'observer - echo'

  delayed:
    name: delayed
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 5
    steps:
      - run: sleep 8
      - run: echo 'observer - delayed completed'

  intermediate:
    name: intermediate
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 5
    steps:
      - run: sleep 10

  slowstarter-success:
    name: slowstarter-success
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 5
    needs: [intermediate]
    steps:
      - run: echo 'observer - slow starter completed'

  default_logic:
    name: default_logic
    runs-on: ubuntu-26.04
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Do NOT specify options except non omittable skip-list to make sure zero config may work
      - uses: $/
        with:
          skip-list: |
            [
              {
                "workflowFile": "e2e-deadlock-hazard.yml"
              },
              {
                "workflowFile": "GH-761-matrix.yml"
              },
              {
                "workflowFile": "e2e-subject.yml"
              }
            ]
  validation_example_basic_errors_allow_failure:
    name: validation_example_basic_errors_allow_failure
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        env:
          ACTIONS_STEP_DEBUG: true
        # Should allow failures in this job
        continue-on-error: true
        with:
          retry-method: 'unknown_method'
          minimum-interval: '15' # Should be 'PT15S'
          attempt-limits: '0'
  validation_example_combination_errors_allow_failure:
    name: validation_example_combination_errors_allow_failure
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        env:
          ACTIONS_STEP_DEBUG: true
        # Should allow failures in this job
        continue-on-error: true
        with:
          wait-list: |
            [
              {
                "workflowFile": "lint.yml"
              }
            ]
          skip-list: |
            [
              {
                "workflowFile": "release.yml"
              }
            ]
  exponential_backoff_allow_failure:
    name: exponential_backoff_allow_failure
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        env:
          ACTIONS_STEP_DEBUG: true
        # With the algorithm, this job takes long minutes to wait completed other jobs
        # So set small limit to stop faster.
        continue-on-error: true
        with:
          retry-method: 'exponential_backoff'
          warmup-delay: 'PT2S'
          minimum-interval: 'PT2S'
          attempt-limits: 2
          skip-same-workflow: 'true'
          skip-list: |
            [
              {
                "workflowFile": "e2e-deadlock-hazard.yml"
              },
              {
                "workflowFile": "GH-761-matrix.yml"
              }
            ]
  equal_intervals:
    name: equal_intervals
    runs-on: ubuntu-26.04
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        env:
          ACTIONS_STEP_DEBUG: true
        with:
          retry-method: 'equal_intervals'
          minimum-interval: 'PT10S'
          attempt-limits: 60
          skip-same-workflow: 'true'
          skip-list: |
            [
              {
                "workflowFile": "e2e-deadlock-hazard.yml"
              },
              {
                "workflowFile": "GH-761-matrix.yml"
              }
            ]
  wait-list:
    name: wait-list
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          retry-method: 'equal_intervals'
          warmup-delay: 'PT0S' # Merged from GH-994
          minimum-interval: 'PT5S'
          attempt-limits: 30
          wait-list: |
            [
              {
                "workflowFile": "lint.yml",
                "optional": ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
              },
              {
                "workflowFile": "update-nixpkgs-and-versions-in-ci.yml",
                "jobName": "update-nixpkgs",
                "optional": true
              },
              {
                "workflowFile": "THERE_ARE_NO_FILES_AS_THIS.yml",
                "optional": true
              }
            ]
  test_outputs:
    name: test_outputs
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        id: wait
        with:
          retry-method: 'equal_intervals'
          warmup-delay: 'PT1S'
          minimum-interval: 'PT3S'
          skip-same-workflow: 'false'
          wait-list: |
            [
              {
                "workflowFile": "e2e-observer.yml",
                "jobName": "delayed",
                "optional": false
              }
            ]
      - name: It outputs parameters
        env:
          WAIT_PARAM: ${{ fromJson(steps.wait.outputs.parameters).options.minimumInterval }}
          WAIT_DUMP: ${{ steps.wait.outputs.dump }}
        run: |
          [[ "$WAIT_PARAM" == 'Temporal.Duration<PT3S>' ]]
          ls -alh "$WAIT_DUMP"
      - name: Upload dumps as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'outputs-${{ github.job }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}'
          path: '${{ steps.wait.outputs.dump }}'
  grace_period:
    name: grace_period
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          retry-method: 'equal_intervals'
          warmup-delay: 'PT1S'
          minimum-interval: 'PT5S'
          attempt-limits: 60
          wait-list: |
            [
              {
                "workflowFile": "e2e-observer.yml",
                "optional": false,
                "jobName": "echo"
              },
              {
                "workflowFile": "e2e-observer.yml",
                "optional": false,
                "jobName": "slowstarter-success",
                "startupGracePeriod": "PT60S"
              }
            ]
  skip-list:
    name: skip-list
    runs-on: ubuntu-slim
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          retry-method: 'equal_intervals'
          minimum-interval: 'PT5S'
          attempt-limits: 30
          skip-same-workflow: 'false' # Intentionally set false to test skip list also can cover this use case
          skip-list: |
            [
              {
                "workflowFile": "e2e-observer.yml"
              },
              {
                "workflowFile": "ci.yml"
              },
              {
                "workflowFile": "e2e-deadlock-hazard.yml"
              },
              {
                "workflowFile": "GH-761-matrix.yml"
              }
            ]
