name: 🤖🛠️

on:
  schedule:
    # 20 is not strict; it comes from: `gh api repos/:owner/:repo --jq '.id % 60'`
    # Run every 3 hours to process bot PRs in a timely manner
    - cron: '20 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-fix:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Generate GitHub Apps token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SAMU_APP_ID }}
          private-key: ${{ secrets.SAMU_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - name: Install direnv
        run: nix profile add --inputs-from . nixpkgs#direnv
      - name: Load environment variables
        run: |
          direnv allow .
          direnv export gha > "$GITHUB_ENV"

      - name: Get pnpm store path
        id: get-pnpm-path
        run: |
          echo "pnpm-store-path=$(nix develop --command pnpm store path --silent)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache pnpm store
        with:
          path: |
            ${{ steps.get-pnpm-path.outputs.pnpm-store-path }}
          key: |
            pnpm_store-pnpm_${{ hashFiles('pnpm-lock.*') }}-flake_${{ hashFiles('flake.lock') }}-${{ runner.arch }}-${{ runner.os }}

      - name: Fix bot PR diffs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ./scripts/auto-fix-bot-prs.sh
